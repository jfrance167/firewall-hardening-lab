name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m py_compile scan_compare.py lab_services.py tests/test_scan_compare.py
      - name: Run tests
        run: python -W error -m unittest discover -s tests -v
      - name: Parse shell scripts
        if: runner.os == 'Linux'
        run: bash -n apply_firewall.sh rollback_firewall.sh
